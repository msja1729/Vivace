# Live viva engines: detector thresholds and score weights.
# Every value is optional; anything left out uses the default in app/live/config.py.

vision:
  fps: 5                    # frames per second the student's browser sends for analysis
  yolo_imgsz: 480           # the frames' own width: small objects like phones stay visible (~15 ms on CPU)
  yolo_conf: 0.45           # objects must also show in 3 of 5 frames, so this can be a little lower

integrity:
  gaze_off_seconds: 3       # looking off-screen (sideways / down) longer than this is flagged
  gaze_up_seconds: 10       # looking up is usually thinking, so it needs longer
  head_yaw_deg: 30
  head_pitch_deg: 20
  head_turn_seconds: 3
  reading_sweeps: 3         # lines read (slow scan across, quick jump back) within the window = "reading"
  reading_window_seconds: 12
  no_face_seconds: 3
  object_frames: 3          # a prohibited object in >= this many of the last 5 frames
  person_conf: 0.65         # a second person counts only above this confidence (shadows score ~0.5)
  objects: [cell phone, laptop, book]   # not "tv": a TV / monitor in the room is normal
  speaker_similarity: 0.25  # voice match below this, twice in a row = another speaker
  lipsync_seconds: 4        # speech heard while the lips stay closed, longer than this

# Cheating Risk Score: sum over flags of weight * (1 + seconds / 10), capped at 100,
# over the last `risk_window_seconds` (the stored session score is the peak).
risk_weights:
  gaze_off_screen: 6
  head_turned: 5
  reading_pattern: 10
  no_face: 8
  multiple_faces: 20
  prohibited_object: 20
  second_person: 25
  secondary_speaker: 20
  lipsync_mismatch: 12
  tab_switch: 15            # left the viva for another tab or app (reported by the browser)
  left_fullscreen: 8        # left full screen
risk_window_seconds: 600

# Conceptual Mastery Score per answer, averaged over answers.
mastery_weights:
  correctness: 0.5
  similarity: 0.3
  fluency: 0.2
